[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stoetzms-pdf"
dynamic = ["version"]
description = "Assemble PDF dossiers from a declarative YAML file: cover, table of contents, section dividers, bookmarks and page numbers."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Miles Stötzner", email = "miles@stoetzner.de" }]
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "weasyprint>=70",
    "pikepdf>=10.16",
    "Pillow>=10.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pymupdf>=1.24",
]

[project.scripts]
stoetzms-pdf = "stoetzms_pdf.cli:main"

[tool.setuptools.dynamic]
version = { attr = "stoetzms_pdf.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stoetzms_pdf = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
