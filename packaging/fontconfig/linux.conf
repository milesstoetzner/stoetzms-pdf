<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fallback font configuration of the Linux binary, used only when the
     system has no /etc/fonts/fonts.conf. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <dir>~/.fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <cachedir>~/.cache/stoetzms-pdf/fontconfig</cachedir>
</fontconfig>
