# Every push to main builds and tests the binaries. Pushing a tag v<version>
# (matching __version__) publishes them as that release and deploys the docs;
# running the workflow by hand deploys the docs only.
name: Release
on:
    workflow_dispatch:
    push:
        branches:
            - main
        tags:
            - 'v*'

concurrency: release-${{ github.ref }}
permissions:
    contents: write

jobs:
    ###################################################
    #
    # Test
    #
    ###################################################

    test:
        name: Test
        timeout-minutes: 15
        runs-on: ubuntu-22.04
        steps:
            - name: (PREPARE) Checkout Repository
              uses: actions/checkout@v4

            - name: (PREPARE) Check Version
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/stoetzms_pdf/__init__.py)
                  if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
                      echo "tag ${GITHUB_REF_NAME} does not match __version__ ${VERSION}" >&2
                      exit 1
                  fi

            - name: (PREPARE) Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
                  cache: pip

            - name: (PREPARE) Install Pango
              run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

            - name: (PREPARE) Install Dependencies
              run: pip install -e '.[test]'

            - name: (TEST) Run Tests
              run: pytest -v --durations=10

    ###################################################
    #
    # Distribution
    #
    ###################################################

    binary:
        name: Binary (${{ matrix.name }})
        timeout-minutes: 30
        needs: test
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: linux-x64
                      runner: ubuntu-22.04
                    - name: linux-arm64
                      runner: ubuntu-22.04-arm
                    - name: macos-arm64
                      runner: macos-15
                    - name: windows-x64
                      runner: windows-2022
        runs-on: ${{ matrix.runner }}
        defaults:
            run:
                shell: bash
        steps:
            - name: (PREPARE) Checkout Repository
              uses: actions/checkout@v4
              with:
                  lfs: true

            - name: (PREPARE) Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
                  cache: pip

            # Built on the oldest supported Ubuntu, so the binary runs on any
            # Linux with glibc 2.35 or newer.
            - name: (PREPARE) Install Pango (Linux)
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fontconfig

            - name: (PREPARE) Install Pango (macOS)
              if: runner.os == 'macOS'
              run: brew install pango

            - name: (PREPARE) Install Pango (Windows)
              if: runner.os == 'Windows'
              uses: msys2/setup-msys2@v2
              with:
                  msystem: UCRT64
                  install: mingw-w64-ucrt-x86_64-pango

            - name: (PREPARE) Install Dependencies
              run: pip install . pyinstaller

            # On Windows, PyInstaller finds the MSYS2 Pango DLLs on PATH. Append
            # them, so MSYS2's own Python does not shadow the one set up above.
            - name: (DIST) Build Binary
              run: |
                  if [ "$RUNNER_OS" = Windows ]; then
                      export PATH="$PATH:$(cygpath -u "$RUNNER_TEMP")/msys64/ucrt64/bin"
                  fi
                  packaging/build.sh

            - name: (DIST) Test Binary
              run: |
                  dist/stoetzms-pdf-${{ matrix.name }}/stoetzms-pdf --strict examples/application --output "${RUNNER_TEMP}/example.pdf"
                  test -s "${RUNNER_TEMP}/example.pdf"

            - name: (DIST) Upload Binary
              uses: actions/upload-artifact@v4
              with:
                  name: stoetzms-pdf-${{ matrix.name }}
                  path: |
                      dist/stoetzms-pdf-*.tar.xz
                      dist/stoetzms-pdf-*.zip
                  if-no-files-found: error

    ###################################################
    #
    # Release
    #
    ###################################################

    release:
        name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        needs: binary
        runs-on: ubuntu-22.04
        timeout-minutes: 15
        steps:
            - name: (PREPARE) Download Binaries
              uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true

            - name: (RELEASE) Create Release
              run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --latest --title "${GITHUB_REF_NAME}" --generate-notes ./dist/*
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    ###################################################
    #
    # Docs
    #
    ###################################################

    docs:
        name: Docs
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        needs: test
        runs-on: ubuntu-22.04
        timeout-minutes: 15
        steps:
            - name: (PREPARE) Checkout Repository
              uses: actions/checkout@v4
              with:
                  lfs: true

            - name: (PREPARE) Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version-file: docs/.nvmrc
                  cache: yarn
                  cache-dependency-path: docs/yarn.lock

            - name: (PREPARE) Install Dependencies
              run: yarn --cwd docs --frozen-lockfile

            - name: (DOCS) Build Docs
              run: yarn --cwd docs build

            - name: (DOCS) Deploy Docs
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: docs/.vitepress/dist
