name: Release
on:
    workflow_dispatch:
    push:
        branches:
            - main

concurrency: release
permissions:
    contents: write

jobs:
    ###################################################
    #
    # Test
    #
    ###################################################

    test:
        name: Test
        runs-on: ubuntu-22.04
        steps:
            - name: (PREPARE) Checkout Repository
              uses: actions/checkout@v4

            - name: (PREPARE) Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
                  cache: pip

            - name: (PREPARE) Install Pango
              run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

            - name: (PREPARE) Install Dependencies
              run: pip install -e '.[test]'

            - name: (TEST) Run Tests
              run: pytest

    ###################################################
    #
    # Distribution
    #
    ###################################################

    binary:
        name: Binary (${{ matrix.name }})
        needs: test
        strategy:
            fail-fast: true
            matrix:
                include:
                    - name: linux-x64
                      runner: ubuntu-22.04
                    - name: linux-arm64
                      runner: ubuntu-22.04-arm
                    - name: macos-arm64
                      runner: macos-14
                    - name: windows-x64
                      runner: windows-2022
        runs-on: ${{ matrix.runner }}
        defaults:
            run:
                shell: bash
        steps:
            - name: (PREPARE) Checkout Repository
              uses: actions/checkout@v4
              with:
                  lfs: true

            - name: (PREPARE) Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
                  cache: pip

            # Built on the oldest supported Ubuntu, so the binary runs on any
            # Linux with glibc 2.35 or newer.
            - name: (PREPARE) Install Pango (Linux)
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fontconfig

            - name: (PREPARE) Install Pango (macOS)
              if: runner.os == 'macOS'
              run: brew install pango

            - name: (PREPARE) Install Pango (Windows)
              if: runner.os == 'Windows'
              uses: msys2/setup-msys2@v2
              with:
                  msystem: UCRT64
                  install: mingw-w64-ucrt-x86_64-pango

            - name: (PREPARE) Find Pango (Windows)
              if: runner.os == 'Windows'
              run: echo "$(cygpath -w "${RUNNER_TEMP}/msys64/ucrt64/bin")" >> "$GITHUB_PATH"

            - name: (PREPARE) Install Dependencies
              run: pip install . pyinstaller

            - name: (DIST) Build Binary
              run: packaging/build.sh

            - name: (DIST) Test Binary
              run: |
                  dist/stoetzms-pdf-${{ matrix.name }}/stoetzms-pdf --strict examples/application --output "${RUNNER_TEMP}/example.pdf"
                  test -s "${RUNNER_TEMP}/example.pdf"

            - name: (DIST) Upload Binary
              uses: actions/upload-artifact@v4
              with:
                  name: stoetzms-pdf-${{ matrix.name }}
                  path: |
                      dist/stoetzms-pdf-*.tar.xz
                      dist/stoetzms-pdf-*.zip
                  if-no-files-found: error

    ###################################################
    #
    # Release
    #
    ###################################################

    release:
        name: Release
        needs: binary
        runs-on: ubuntu-22.04
        steps:
            - name: (PREPARE) Checkout Repository
              uses: actions/checkout@v4
              with:
                  lfs: true

            - name: (PREPARE) Download Binaries
              uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true

            - name: (RELEASE) Delete Latest Release
              run: gh release delete latest --cleanup-tag --yes || true
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: (RELEASE) Delete Latest Tag (Local)
              run: git tag --delete latest || true

            - name: (RELEASE) Create Latest Release
              run: gh release create latest --target ${GITHUB_SHA} --latest -t "Latest Release" -n "This is the latest release of this project" ./dist/*
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            ###################################################
            #
            # Docs
            #
            ###################################################

            - name: (DOCS) Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version-file: docs/.nvmrc
                  cache: yarn
                  cache-dependency-path: docs/yarn.lock

            - name: (DOCS) Install Dependencies
              run: yarn --cwd docs --frozen-lockfile

            - name: (DOCS) Build Docs
              run: yarn --cwd docs build

            - name: (DOCS) Deploy Docs
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: docs/.vitepress/dist

            - name: (RELEASE) Archive Docs
              run: tar -czvf docs.tar.gz -C docs/.vitepress/dist .

            - name: (RELEASE) Upload Docs to Release
              run: gh release upload latest docs.tar.gz
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
