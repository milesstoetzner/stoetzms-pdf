name: Test
on:
    workflow_dispatch:
    pull_request:

# a new push to a pull request cancels the run of the previous one
concurrency:
    group: test-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        name: Test
        timeout-minutes: 15
        runs-on: ubuntu-22.04
        steps:
            ###################################################
            #
            # Prepare
            #
            ###################################################

            - name: (PREPARE) Checkout Repository
              uses: actions/checkout@v4
              with:
                  lfs: true

            - name: (PREPARE) Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
                  cache: pip

            - name: (PREPARE) Install Pango
              run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

            - name: (PREPARE) Install Dependencies
              run: pip install -e '.[test]'

            - name: (PREPARE) Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version-file: docs/.nvmrc
                  cache: yarn
                  cache-dependency-path: docs/yarn.lock

            - name: (PREPARE) Install Docs Dependencies
              run: yarn --cwd docs --frozen-lockfile

            ###################################################
            #
            # Test
            #
            ###################################################

            - name: (TEST) Run Tests
              run: pytest -v --durations=10

            - name: (TEST) Build Example
              run: stoetzms-pdf --strict examples/application --output /tmp/example.pdf

            ###################################################
            #
            # Docs
            #
            ###################################################

            - name: (DOCS) Build Docs
              run: yarn --cwd docs build
